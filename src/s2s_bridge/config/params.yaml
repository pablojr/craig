s2s_viseme_bridge:
  ros__parameters:
    server_url: 'ws://10.0.0.202:8765/v1/realtime'
    listen_host: '0.0.0.0'
    listen_port: 18765

    # Jaw smoother
    jaw_min: 0.0
    jaw_max: 0.349
    attack_tau_s: 0.030
    release_tau_s: 0.110
    publish_rate_hz: 50.0
    publish_epsilon: 0.002

    # Gesture triggering
    gesture_enabled: true
    # Set to true to avoid publishing "neutral" (keeps Craig's last pose)
    gesture_suppress_neutral: true
    # Minimum transcript characters before classifying (reduces spurious triggers)
    gesture_min_text_length: 10

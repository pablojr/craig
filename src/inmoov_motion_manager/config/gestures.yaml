# Predefined gestures for inmoov_motion_manager.
# Positions are in radians and within the URDF/config limits.
# Mimic joints are deliberately omitted; the URDF publishes their derived motion.
gestures:
  neutral:
    duration_sec: 2.0
    positions:
      waist_pan_joint: 0.0
      waist_roll_joint: 0.0
      head_pan_joint: 0.0
      head_tilt_joint: 0.0
      head_roll_joint: 0.0
      eyes_pan_joint: 0.0
      eyes_tilt_joint: 0.0
      jaw_joint: 0.0
      l_shoulder_lift_joint: 0.785398
      l_shoulder_out_joint: 0.087266
      l_upper_arm_roll_joint: -1.570796
      l_elbow_flex_joint: -0.261799
      r_shoulder_lift_joint: 0.785398
      r_shoulder_out_joint: -0.087266
      r_upper_arm_roll_joint: 1.570796
      r_elbow_flex_joint: -0.261799

  look_left:
    duration_sec: 1.0
    positions:
      head_pan_joint: 0.610865
      eyes_pan_joint: 0.349066

  look_right:
    duration_sec: 1.0
    positions:
      head_pan_joint: -0.872665
      eyes_pan_joint: -0.349066

  nod:
    duration_sec: 1.2
    positions:
      head_tilt_joint: 0.174533
  look_up:
    duration_sec: 1.0
    positions:
      head_tilt_joint: 0.349066
      eyes_tilt_joint: -0.261799
  look_down:
    duration_sec: 1.0
    positions:
      head_tilt_joint: -0.349066
      eyes_tilt_joint: 0.261799

  jaw_open:
    duration_sec: 0.5
    positions:
      jaw_joint: 0.087266

  jaw_close:
    duration_sec: 0.5
    positions:
      jaw_joint: 0.0
  wave:
    duration_sec: 2.0
    positions:
      r_shoulder_lift_joint: 0.785398
      r_shoulder_out_joint: -0.698132
      r_upper_arm_roll_joint: 1.570796
      r_elbow_flex_joint: -1.396263
      r_wrist_roll_joint: -1.570796
  hands_open:
    duration_sec: 1.5
    positions:
      l_thumb_joint: -0.087266
      l_index_joint: -0.087266
      l_middle_joint: -0.087266
      l_ring_joint: -0.087266
      l_pinky_joint: -0.087266
      r_thumb_joint: -0.087266
      r_index_joint: -0.087266
      r_middle_joint: -0.087266
      r_ring_joint: -0.087266
      r_pinky_joint: -0.087266
  hands_closed:
    duration_sec: 1.5
    positions:
      l_thumb_joint: 1.134464
      l_index_joint: 1.483530
      l_middle_joint: 1.483530
      l_ring_joint: 1.483530
      l_pinky_joint: 1.483530
      r_thumb_joint: 1.134464
      r_index_joint: 1.483530
      r_middle_joint: 1.483530
      r_ring_joint: 1.483530
      r_pinky_joint: 1.483530


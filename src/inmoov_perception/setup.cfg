[metadata]
name = inmoov_perception
version = 0.1.0
description = Vision perception node for InMoov robot (YOLO tracking + Ollama VLM query).
author = Pablo
license = Apache-2.0

[options]
packages = find:
install_requires =
    opencv-python
    ultralytics
    requests
    rclpy
    sensor_msgs
    std_msgs
    geometry_msgs
    cv_bridge

[options.entry_points]
console_scripts =
    inmoov_perception_node = inmoov_perception.inmoov_perception_node:main
